<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c8f78" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mini Games" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>In &amp; Out</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../icon.svg" />
    <link rel="stylesheet" href="../shared/shell.css?v=1" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <main class="game-shell">
      <header class="panel-heading">
        <a class="nav-button" href="../../index.html">Library</a>
        <div class="title-block">
          <p class="eyebrow">mental tracking</p>
          <h1>In &amp; Out</h1>
        </div>
      </header>

      <section class="game-layout">
        <div class="game-screen inout-screen">
          <div class="screen-controls top-controls">
            <label class="select-control">
              <span>Mode</span>
              <select id="inoutMode">
                <option value="house">House</option>
                <option value="classic">Classic</option>
              </select>
            </label>
            <button class="primary-button" type="button" id="startInout">Start</button>
          </div>
          <div class="play-area">
            <canvas id="inoutCanvas" width="960" height="560" aria-label="In and Out house counting game"></canvas>
            <div class="screen-count" id="screenCount" aria-live="polite">Press Start</div>
          </div>
          <div class="under-panel">
            <div class="answer-panel is-disabled" id="answerPanel">
              <div class="answer-entry" id="answerEntry">Answer</div>
              <div class="answer-edit-row">
                <button type="button" data-answer-key="clear">Clear</button>
                <button type="button" data-answer-key="backspace">Back</button>
              </div>
              <div class="answer-numpad" aria-label="Answer numpad">
                <button type="button" data-answer-key="1">1</button>
                <button type="button" data-answer-key="2">2</button>
                <button type="button" data-answer-key="3">3</button>
                <button type="button" data-answer-key="4">4</button>
                <button type="button" data-answer-key="5">5</button>
                <button type="button" data-answer-key="6">6</button>
                <button type="button" data-answer-key="7">7</button>
                <button type="button" data-answer-key="8">8</button>
                <button type="button" data-answer-key="9">9</button>
                <button class="zero-key" type="button" data-answer-key="0">0</button>
              </div>
              <button class="primary-button submit-answer" type="button" id="submitAnswer">Submit</button>
            </div>
            <div class="stat-grid">
              <div><span>Score</span><strong id="inoutScore">0</strong></div>
              <div><span>Best</span><strong id="inoutBest">0</strong></div>
              <div><span>Round</span><strong id="inoutRound">0/10</strong></div>
              <div><span>Answer</span><strong id="inoutAnswerState">-</strong></div>
            </div>
            <p class="game-message" id="inoutMessage">Press Start.</p>
          </div>
        </div>
      </section>
    </main>
    <script src="game.js?v=11"></script>
    <script src="../shared/share.js?v=3"></script>
  </body>
</html>
